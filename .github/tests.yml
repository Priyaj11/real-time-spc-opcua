# Runs the full suite on every push and pull request.
#
# This is the badge on the README and the thing an interviewer clicks. It also
# catches the class of bug that only shows up on a machine that is not yours:
# a file committed with the wrong name, a dependency that was installed by hand
# months ago and never written down, a test that only passes because of
# something left behind in your working folder.
#
# Note there is no `pip install -e .` step. The package layout is flat, so a
# plain clone is importable as-is.

name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The project declares requires-python >= 3.11, so both are tested.
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint
        run: python -m ruff check .

      - name: Test
        # Everything, including the tests that open real sockets on localhost.
        run: python -m pytest

      - name: Coverage
        # Measured separately, and only over the deterministic tests. Coverage
        # traces every executed line, which slows the OPC UA server's
        # publishing loop enough that a test pacing at 100x simulated time
        # starves its client's subscription. The step above already ran those.
        run: python -m pytest -m "not integration" --cov --cov-report=term-missing